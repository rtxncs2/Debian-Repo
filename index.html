<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Repository & App Downloads</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --tag-appimage: #818cf8;
      --tag-deb: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .file-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .file-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.2s, background-color 0.2s;
    }

    .file-card:hover {
      background-color: var(--card-hover);
    }

    @media (min-width: 640px) {
      .file-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      overflow: hidden;
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      white-space: nowrap;
    }

    .badge-appimage { background-color: rgba(129, 140, 248, 0.2); color: var(--tag-appimage); border: 1px solid var(--tag-appimage); }
    .badge-deb { background-color: rgba(244, 63, 94, 0.2); color: var(--tag-deb); border: 1px solid var(--tag-deb); }

    .file-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filename {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .file-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .btn:hover {
      opacity: 0.85;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Package & App Repository</h1>
    <p>Direct download links with default filenames</p>
  </header>

  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="filterType('all')">All</button>
      <button class="filter-btn" onclick="filterType('appimage')">AppImage</button>
      <button class="filter-btn" onclick="filterType('deb')">DEB</button>
    </div>
  </div>

  <div id="fileList" class="file-list"></div>
</div>

<script>
  const files = [
    { name: "Budget Planner-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/Budget%20Planner-1.0.0.AppImage" },
    { name: "ExpenseSplitter-x86_64.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/ExpenseSplitter-x86_64.AppImage" },
    { name: "IPTVPlayer-x86_64.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/IPTVPlayer-x86_64.AppImage" },
    { name: "finance-tracker_1.0.0_amd64.deb", type: "deb", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/finance-tracker_1.0.0_amd64.deb" },
    { name: "GreenNoise-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/GreenNoise-1.0.0.AppImage" },
    { name: "JerryTimer.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/JerryTimer.AppImage" },
    { name: "myplayer_1.0.0_amd64.deb", type: "deb", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/myplayer_1.0.0_amd64.deb" },
    { name: "Notes-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/Notes-1.0.0.AppImage" },
    { name: "screen-recorder_1.0.0_amd64.deb", type: "deb", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/screen-recorder_1.0.0_amd64.deb" },
    { name: "ScreenshotTool-x86_64.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/ScreenshotTool-x86_64.AppImage" },
    { name: "ShoppingList-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/ShoppingList-1.0.0.AppImage" },
    { name: "video-extractor-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/video-extractor-1.0.0.AppImage" },
    { name: "videotrimmer-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/videotrimmer-1.0.0.AppImage" },
    { name: "WarehouseProERP-3.0-x86_64.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/WarehouseProERP-3.0-x86_64.AppImage" },
    { name: "webm2mp4-1.0.0.AppImage", type: "appimage", url: "https://github.com/rtxncs2/apt/raw/refs/heads/main/webm2mp4-1.0.0.AppImage" }
  ];

  let currentFilter = 'all';

  function render() {
    const listEl = document.getElementById('fileList');
    listEl.innerHTML = '';

    const filtered = files.filter(f => currentFilter === 'all' || f.type === currentFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No files found for this category.</div>';
      return;
    }

    filtered.forEach(file => {
      const card = document.createElement('div');
      card.className = 'file-card';

      const typeBadgeClass = `badge-${file.type}`;
      const typeLabel = file.type === 'appimage' ? 'AppImage' : 'DEB Package';

      card.innerHTML = `
        <div class="file-info">
          <span class="badge ${typeBadgeClass}">${typeLabel}</span>
          <div class="file-details">
            <span class="filename">${file.name}</span>
          </div>
        </div>
        <div class="file-actions">
          <button class="btn btn-secondary" onclick="copyUrl('${file.url}', this)">Copy URL</button>
          <a class="btn btn-primary" href="${file.url}" download="${file.name}">Download</a>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function filterType(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    render();
  }

  function copyUrl(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      const origText = btn.innerText;
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = origText, 1500);
    });
  }

  render();
</script>

</body>
</html>
